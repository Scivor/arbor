[project]
name = "arbor"
version = "3.0.0"
description = "Coffee price forecast and hedge-ratio system"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
authors = [
    {name = "Duncan"},
]
keywords = ["coffee", "hedging", "futures", "commodity", "trading", "quantitative"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "pyyaml>=6.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "requests>=2.31.0",
    "yfinance>=0.2.30",
    "pdfplumber>=0.11",
    "akshare>=1.10.0",
]

[project.urls]
Homepage = "https://github.com/Scivor/arbor"
Repository = "https://github.com/Scivor/arbor"

[project.scripts]
arbor = "coffee:main"

[tool.setuptools]
py-modules = ["coffee", "coffee_system"]

[tool.setuptools.packages.find]
where = ["."]
include = ["arbor*", "backtest*", "cli*", "core*", "domains*", "models*", "reports*", "sources*"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: Unit tests (fast, no network)",
    "integration: Integration tests (may need network)",
]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# __init__.py 的 re-export 是刻意的（包公共 API 汇总出口）
"__init__.py" = ["F401"]
# models/* 有 sys.path 引导（模型可独立脚本化运行）
"models/*" = ["E402"]
