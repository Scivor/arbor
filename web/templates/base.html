<!DOCTYPE html>
<html lang="{% if lang == 'en' %}en{% else %}zh-CN{% endif %}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Arbor{% endblock %}</title>
<link rel="stylesheet" href="/static/css/kami.css">
{% block extra_head %}{% endblock %}
</head>
<body>

<nav class="site-nav">
  <div class="site-nav-inner">
    <a href="/" class="site-brand" aria-label="Arbor">
      <img class="site-brand-logo" src="/static/img/arbor-wordmark-nav.png" alt="Arbor" width="120" height="34" />
    </a>
    <div class="site-links">
      {% if lang == 'en' %}
      <a href="/?lang=en" {% if request.url.path == '/' or request.url.path.startswith('/daily') %}class="active"{% endif %}>Today</a>
      <a href="{% if weekly %}/reports/{{ weekly }}/?lang=en{% else %}/reports/?lang=en{% endif %}" {% if request.url.path.startswith('/reports/') and request.url.path != '/reports/' %}class="active"{% endif %}>Weekly</a>
      <a href="/chat/" {% if request.url.path.startswith('/chat') %}class="active"{% endif %}>Advisor</a>
      <a href="/reports/?lang=en" {% if request.url.path == '/reports/' or request.url.path == '/reports' %}class="active"{% endif %}>Archive</a>
      <a href="{{ request.url.path }}">中文</a>
      {% else %}
      <a href="/" {% if request.url.path == '/' or request.url.path.startswith('/daily') %}class="active"{% endif %}>今日</a>
      <a href="{% if weekly %}/reports/{{ weekly }}/{% else %}/reports/{% endif %}" {% if request.url.path.startswith('/reports/') and request.url.path != '/reports/' %}class="active"{% endif %}>周报</a>
      <a href="/chat/" {% if request.url.path.startswith('/chat') %}class="active"{% endif %}>顾问</a>
      <a href="/reports/" {% if request.url.path == '/reports/' or request.url.path == '/reports' %}class="active"{% endif %}>档案</a>
      <a href="{{ request.url.path }}?lang=en">EN</a>
      {% endif %}
    </div>
  </div>
</nav>

<main class="site-main">
  {% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <p>{% if lang == 'en' %}Generated by Arbor · For internal reference only{% else %}Generated by Arbor · 数据仅供内部参考，不构成投资建议{% endif %}</p>
</footer>

</body>
</html>
